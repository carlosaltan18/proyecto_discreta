name: Publicar versiones accesibles
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install pyinstaller==6.22.3
      - run: python -m unittest discover -v
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name MM2015-RSA app.py
      - uses: actions/upload-artifact@v4
        with:
          name: MM2015-RSA-Windows
          path: dist/MM2015-RSA.exe
