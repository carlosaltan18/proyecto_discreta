name: Generar ejecutable Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install pyinstaller==6.22.3
      - run: python -m unittest discover -v
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name MM2015-RSA app.py
      - uses: actions/upload-artifact@v4
        with:
          name: MM2015-RSA-Windows
          path: dist/MM2015-RSA.exe
